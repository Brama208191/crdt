spring.application.name=crdt-editor
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/crdt}
spring.datasource.username=${DATABASE_USER:crdt}
spring.datasource.password=${DATABASE_PASSWORD:crdt}
spring.datasource.hikari.maximum-pool-size=5

management.endpoints.web.exposure.include=health

# Always revalidate static files so a redeploy is picked up immediately (bundles are content-hashed).
spring.web.resources.cache.cachecontrol.no-cache=true

# Render terminates TLS at a proxy; trust X-Forwarded-For so rate limits see the real client IP.
server.forward-headers-strategy=native
