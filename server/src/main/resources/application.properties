spring.application.name=crdt-editor
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/crdt}
spring.datasource.username=${DATABASE_USER:crdt}
spring.datasource.password=${DATABASE_PASSWORD:crdt}
spring.datasource.hikari.maximum-pool-size=5
# Close idle connections after a minute. An open connection counts as traffic, and would keep the
# app and the database from ever going to sleep on Railway.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

management.endpoints.web.exposure.include=health

# SHA-256 (hex) of the admin password. Unset = no admin; only each document's creator can manage it.
crdt.admin-key-hash=${ADMIN_KEY_HASH:}

# Always revalidate static files so a redeploy is picked up immediately. Files inside a jar all carry
# the same 1980 timestamp, so Last-Modified would answer "304 not modified" across deploys and leave
# browsers on an old index.html whose bundles no longer exist; it is turned off. The content-hashed
# bundles under /assets are cached for a year instead (see StaticAssetsConfig).
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=false

# The host terminates TLS at a proxy; trust X-Forwarded-For so rate limits see the real client IP.
server.forward-headers-strategy=native
server.shutdown=graceful
